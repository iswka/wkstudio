version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: user-auth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: user_auth
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - user-auth-network

  user-api:
    build: .
    container_name: user-auth-api
    ports:
      - "8888:8888"
    depends_on:
      - mysql
    environment:
      TZ: Asia/Shanghai
    networks:
      - user-auth-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  user-auth-network:
    driver: bridge
